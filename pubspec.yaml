name: smart_attendance
description: Smart Geo-Face Attendance System - Enterprise Grade
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Camera & Face
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0
  image_picker: ^1.1.2

  # Location & Geofencing
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Local Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

  # UI
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
